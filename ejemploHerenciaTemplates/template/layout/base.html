<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    {% block estilos %}{% endblock %}
    
</head>

<body class="container mt-5">
    <div class="alert alert-info text-center display-1">{{ titulo }}</div>
    <div class="col text-center display-1 ">
        <a href="{% url 'index' %}" class="btn btn-info p-4 w-50 text-center">Index</a>
    </div>
    <br><br><br><br><br>
    <div class="row">
        <div class="col"><a href="{% url 'personal' %}" class="btn btn-info p-3 w-100">Personal</a></div>
        <div class="col"><a href="{% url 'clientes' %}" class="btn btn-success p-3 w-100">Clientes</a></div>
        <div class="col"><a href="{% url 'egresados' %}" class="btn btn-warning p-3 w-100">Egresados</a></div>
    </div>
    <div class="text-center display-2">
        
    </div>

    <br><br>

    <div class="col">
        {% block contenido %}{% endblock %}
    </div>

</body>

<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

<footer>
    <div>
        <h2>Creado por Mi</h2>
    </div>
</footer>
</html>
